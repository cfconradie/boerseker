<div id="t4">TEST 4 — Vue via dinamiese DOM-injektor (omseil sanitizer wat external src blok).</div>
<script>
(function(){
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/vue@3/dist/vue.global.prod.js';
  s.onload = function(){
    document.getElementById('t4').textContent = typeof Vue !== 'undefined'
      ? 'TEST 4 ✓ dinamiese loader werk — Vue gelaai'
      : 'TEST 4 ✗ Vue gefaal';
  };
  s.onerror = function(){
    document.getElementById('t4').textContent = 'TEST 4 ✗ kon nie Vue laai nie';
  };
  document.head.appendChild(s);
})();
</script>
